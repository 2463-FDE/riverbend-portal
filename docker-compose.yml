services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-riverbend}
      POSTGRES_USER: ${DB_USER:-riverbend_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-riverbend_app} -d ${DB_NAME:-riverbend}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ./services/gateway
    env_file: .env
    environment:
      INTAKE_URL: http://intake-service:8071
      ELIGIBILITY_URL: http://eligibility-service:8072
      RECORDS_URL: http://records-service:8073
      SCHEDULING_URL: http://scheduling-service:8074
      INTEROP_URL: http://interop-service:8075
      ROI_URL: http://roi-service:8076
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8077
      # W2 knowledge-ingest capability (services/gateway/authz.py). An interim
      # control until the role hierarchy lands (D7, W9): the inherited system has
      # exactly one role and cannot express a capability, so the allowlist is
      # env-driven. Demo default grants the front-desk lead; production sets the
      # real list. Empty here would make the ingest gate untestable end-to-end,
      # which is how a control ships unexercised.
      KNOWLEDGE_INGEST_USERS: "${KNOWLEDGE_INGEST_USERS:-frontdesk,rdelgado}"
      KNOWLEDGE_INGEST_ROLES: "${KNOWLEDGE_INGEST_ROLES:-knowledge_admin}"
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      intake-service:
        condition: service_started
      records-service:
        condition: service_started
      scheduling-service:
        condition: service_started
      roi-service:
        condition: service_started
      ai-orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8078:8000"
    volumes:
      # Derived data — rebuildable from source documents via
      # POST /ai/knowledge/seed. See docs/runbook.md before relying on it.
      - chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-orchestrator:
    build: ./services/ai-orchestrator
    env_file: .env
    environment:
      # Stub by default: the stack runs with no AWS credentials and spends
      # nothing. Flip to false only with a credential AND after the retention
      # preflight passes (adr/0004 §1a).
      USE_STUB_BEDROCK: "${USE_STUB_BEDROCK:-true}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      BEDROCK_MODEL_ID: "${BEDROCK_MODEL_ID:-us.anthropic.claude-3-5-haiku-20241022-v1:0}"
      RIVERBEND_SEED_DIR: /seed
      CHROMA_MODE: "${CHROMA_MODE:-http}"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      RAG_EMBED_BACKEND: "${RAG_EMBED_BACKEND:-offline}"
      # adr/0014 — the two-phase ingest gate stages pre-commit document text
      # here. That text is explicitly NOT de-identified, so staging.py encrypts
      # it with LANGGRAPH_AES_KEY, the same key path as the checkpointer.
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8077:8077"
    volumes:
      # The handover dump the W2 eval and the W4 patient view read. Read-only:
      # this is source data, and the service has no business writing to it.
      - ./db/seed:/seed:ro
    depends_on:
      chroma:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8077/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  intake-service:
    build: ./services/intake-service
    env_file: .env
    environment:
      ELIGIBILITY_URL: http://eligibility-service:8072
    ports:
      - "8071:8071"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8071/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  eligibility-service:
    build: ./services/eligibility-service
    env_file: .env
    ports:
      - "8072:8072"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8072/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  records-service:
    build: ./services/records-service
    env_file: .env
    ports:
      - "8073:8073"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8073/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduling-service:
    build: ./services/scheduling-service
    env_file: .env
    ports:
      - "8074:8074"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8074/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  interop-service:
    build: ./services/interop-service
    env_file: .env
    ports:
      - "8075:8075"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8075/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  roi-service:
    build: ./services/roi-service
    env_file: .env
    ports:
      - "8076:8076"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8076/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      GATEWAY_URL: http://gateway:8070
    ports:
      - "3070:3070"
    depends_on:
      - gateway

volumes:
  pgdata:
  chroma-data:
